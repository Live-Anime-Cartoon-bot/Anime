openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: streams
    description: Live TV stream proxy and playlist operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /m3u:
    get:
      operationId: getM3u
      tags: [streams]
      summary: Fetch an M3U playlist through the proxy
      description: Fetches an external M3U playlist and returns it with CORS headers.
      parameters:
        - name: url
          in: query
          required: true
          description: URL of the M3U playlist to fetch
          schema:
            type: string
      responses:
        "200":
          description: M3U playlist text
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to fetch playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /stream:
    get:
      operationId: getStream
      tags: [streams]
      summary: Proxy an HLS/video stream
      description: Proxies any stream URL so the browser can play it without CORS restrictions.
      parameters:
        - name: url
          in: query
          required: true
          description: URL of the stream to proxy
          schema:
            type: string
        - name: cookie
          in: query
          required: false
          description: Optional upstream cookie header
          schema:
            type: string
        - name: ua
          in: query
          required: false
          description: Optional upstream User-Agent
          schema:
            type: string
        - name: ref
          in: query
          required: false
          description: Optional upstream referrer
          schema:
            type: string
      responses:
        "200":
          description: Stream content (HLS manifest, TS segments, or other media)
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            video/mp2t:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to proxy stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /channels:
    get:
      operationId: getChannels
      tags: [streams]
      summary: Parse an M3U playlist into a channel list
      description: Fetches the playlist and returns parsed channels with name, logo, and stream URL.
      parameters:
        - name: playlist
          in: query
          required: true
          description: URL of the M3U playlist to parse
          schema:
            type: string
        - name: playlist2
          in: query
          required: false
          description: Optional second M3U playlist to merge
          schema:
            type: string
      responses:
        "200":
          description: Parsed channel list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to parse playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Channel:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          description: Channel name
        url:
          type: string
          description: Stream URL
        logo:
          type: ["string", "null"]
          description: Channel logo URL
        group:
          type: ["string", "null"]
          description: Channel group or category
        cookie:
          type: ["string", "null"]
          description: Cookie header to forward when proxying the stream
        licenseUrl:
          type: ["string", "null"]
          description: ClearKey DRM license URL
        userAgent:
          type: ["string", "null"]
          description: User-Agent to use when proxying the stream
        referrer:
          type: ["string", "null"]
          description: Referrer to use when proxying the stream
        licenseKey:
          type: ["string", "null"]
          description: Inline ClearKey KID:key pairs
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
